name: LocalDictation
options:
  bundleIdPrefix: com.natemunk
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ENABLE_HARDENED_RUNTIME: YES

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: "0.15.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: "0.14.3"
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: "7.10.0"
  TOMLKit:
    url: https://github.com/LebJe/TOMLKit.git
    exactVersion: "0.6.0"

targets:
  LocalDictation:
    type: application
    platform: macOS
    sources:
      - path: Overwhisper
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natemunk.LocalDictation
        INFOPLIST_FILE: Overwhisper/Info.plist
        CODE_SIGN_ENTITLEMENTS: Overwhisper/Overwhisper.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - package: WhisperKit
      - package: FluidAudio
      - package: GRDB
      - package: TOMLKit

schemes:
  LocalDictation:
    build:
      targets:
        LocalDictation: all
    run:
      config: Debug
    archive:
      config: Release
