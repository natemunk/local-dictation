name: CI

on:
  push:
  pull_request:

jobs:
  build-test-audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: uname -m && xcodebuild -version && swift --version

      - name: Verify local signing import
        run: zsh scripts/verify-local-signing-import.sh

      - name: Resolve pinned packages
        run: swift package resolve

      - name: Build app and benchmark CLI
        run: swift build --product LocalDictation && swift build --product local-dictation-benchmark

      - name: Run tests
        run: swift test

      - name: Verify benchmark fixtures
        run: zsh Benchmark/verify-fixtures.sh

      - name: Audit privacy invariants
        run: zsh scripts/privacy-audit.sh

      - name: Verify setup packaging
        shell: zsh {0}
        run: |
          isolated_home=$(mktemp -d "$RUNNER_TEMP/local-dictation-home.XXXXXX")
          HOME="$isolated_home" ./setup --no-launch --skip-tests --ci-adhoc-signing

          app="$isolated_home/Applications/Local Dictation.app"
          plist="$app/Contents/Info.plist"
          binary="$app/Contents/MacOS/LocalDictation"

          [[ -d "$app" && -f "$plist" && -x "$binary" ]] || {
            print -u2 "::error::setup did not create the expected application bundle"
            exit 1
          }

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"

          bundle_id=$(/usr/bin/plutil -extract CFBundleIdentifier raw "$plist")
          [[ "$bundle_id" == "com.natemunk.LocalDictation" ]] || {
            print -u2 "::error::unexpected bundle identifier: $bundle_id"
            exit 1
          }

          minimum_os=$(/usr/bin/plutil -extract LSMinimumSystemVersion raw "$plist")
          [[ "$minimum_os" == "15.0" ]] || {
            print -u2 "::error::unexpected minimum macOS version: $minimum_os"
            exit 1
          }

          architectures=$(/usr/bin/lipo -archs "$binary")
          [[ "$architectures" == "arm64" ]] || {
            print -u2 "::error::expected an arm64-only executable, found: $architectures"
            exit 1
          }

          first_requirement=$(/usr/bin/codesign -d -r- "$app" 2>&1 | /usr/bin/sed -n 's/^designated =>/designated =>/p')
          HOME="$isolated_home" ./setup --no-launch --skip-tests --ci-adhoc-signing
          second_requirement=$(/usr/bin/codesign -d -r- "$app" 2>&1 | /usr/bin/sed -n 's/^designated =>/designated =>/p')
          [[ -n "$first_requirement" && "$first_requirement" == "$second_requirement" ]] || {
            print -u2 "::error::designated requirement drifted across two packaged builds"
            exit 1
          }
